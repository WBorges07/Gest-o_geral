<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Pro - Financeiro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .badge-status {
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border: 1px solid transparent;
            transition: var(--transition);
        }
        .badge-status.pago {
            background-color: rgba(0, 255, 136, 0.2);
            color: var(--accent);
            border-color: var(--accent);
        }
        .badge-status.pendente {
            background-color: rgba(255, 204, 0, 0.2);
            color: #ffcc00;
            border-color: #ffcc00;
        }
        .btn-logout {
            margin-top: auto;
            background: rgba(255, 68, 68, 0.15);
            color: #ff4444;
            border: 1px solid #ff4444;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            text-align: center;
            transition: var(--transition);
        }
        .btn-logout:hover {
            background: #ff4444;
            color: #fff;
        }
    </style>
</head>
<body class="dark-mode">

<nav class="sidebar" style="display: flex; flex-direction: column; justify-content: space-between; height: 100vh;">
    <div>
        <div class="sidebar-header">
            <h3>Menu</h3>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Vendas</a></li>
            <li><a href="#" class="active">Financeiro</a></li>
            <li><a href="cs.html">CS</a></li>
            <li><a href="trafego.html">Gestão de Tráfego</a></li>
            <li><a href="midias.html">Mídias</a></li>
            <li><a href="bi.html">B.I</a></li>
        </ul>
    </div>
    <div style="padding: 15px;">
        <button id="btnSair" class="btn-logout">🚪 Sair</button>
    </div>
</nav>

<main class="main-content">
    <div class="container">
        <h2>💰 Gestão Financeira</h2>
        
        <div class="filter-container">
            <div class="field">
                <label>Vendedor</label>
                <select id="filtroVendedorFin">
                    <option value="todos">Todos</option>
                    <option>Ronny</option><option>Névio</option><option>Marysol</option>
                    <option>Victor</option><option>Bianca</option><option>Wagner</option>
                </select>
            </div>
            <div class="field">
                <label>Mês Referência</label>
                <select id="filtroMesFin">
                    <option value="todos">Todos</option>
                    <option>Janeiro</option><option>Fevereiro</option><option>Março</option>
                    <option>Abril</option><option>Maio</option><option>Junho</option>
                    <option>Julho</option><option>Agosto</option><option>Setembro</option>
                    <option>Outubro</option><option>Novembro</option><option>Dezembro</option>
                </select>
            </div>
            <div class="field">
                <label>Ano</label>
                <select id="filtroAnoFin">
                    <option value="todos">Todos os Anos</option>
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026" selected>2026</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Vendedor</th>
                        <th>Cliente</th>
                        <th>Telefone</th>
                        <th>Valor Total</th>
                        <th>Entrada</th>
                        <th>Forma</th>
                        <th>Status Pagamento</th>
                    </tr>
                </thead>
                <tbody id="listaFinanceiroCorpo"></tbody>
            </table>
        </div>
    </div>
</main>

<script type="module" src="financeiro.js"></script>
</body>
</html>
