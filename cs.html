<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Pro - CS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/imask"></script>
    <style>
        .select-material {
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            outline: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .select-material.entregue {
            background-color: rgba(0, 122, 255, 0.2);
            color: #3399ff;
            border-color: #007aff;
        }
        .select-material.revisao {
            background-color: rgba(255, 204, 0, 0.2);
            color: #ffcc00;
            border-color: #ffcc00;
        }
        .select-material.aprovado {
            background-color: rgba(0, 255, 136, 0.2);
            color: var(--accent);
            border-color: var(--accent);
        }
        /* Ajuste de largura e usabilidade para áreas de texto */
        .input-textarea-cs {
            width: 100%;
            min-width: 180px;
            min-height: 55px;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--input);
            color: var(--text);
            font-size: 0.85rem;
            resize: vertical;
            box-sizing: border-box;
        }
        /* Estilização do Botão Sair no Menu */
        .btn-logout {
            margin-top: auto;
            background: rgba(255, 68, 68, 0.15);
            color: #ff4444;
            border: 1px solid #ff4444;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            text-align: center;
            transition: var(--transition);
        }
        .btn-logout:hover {
            background: #ff4444;
            color: #fff;
        }
    </style>
</head>
<body class="dark-mode">

<nav class="sidebar" style="display: flex; flex-direction: column; justify-content: space-between; height: 100vh;">
    <div>
        <div class="sidebar-header">
            <h3>Menu</h3>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Vendas</a></li>
            <li><a href="financeiro.html">Financeiro</a></li>
            <li><a href="#" class="active">CS</a></li>
            <li><a href="trafego.html">Gestão de Tráfego</a></li>
        </ul>
    </div>
    <div style="padding: 15px;">
        <button id="btnSair" class="btn-logout">🚪 Sair</button>
    </div>
</nav>

<main class="main-content">
    <div class="container" style="max-width: 1500px;">
        <h2>🤝 Customer Success (CS)</h2>
        
        <div class="filter-container">
            <div class="field">
                <label>Vendedor</label>
                <select id="filtroVendedorCS">
                    <option value="todos">Todos</option>
                    <option>Ronny</option><option>Névio</option><option>Marysol</option>
                    <option>Victor</option><option>Bianca</option><option>Wagner</option>
                </select>
            </div>
            <div class="field">
                <label>Mês Referência</label>
                <select id="filtroMesCS">
                    <option value="todos">Todos</option>
                    <option>Janeiro</option><option>Fevereiro</option><option>Março</option>
                    <option>Abril</option><option>Maio</option><option>Junho</option>
                    <option>Julho</option><option>Agosto</option><option>Setembro</option>
                    <option>Outubro</option><option>Novembro</option><option>Dezembro</option>
                </select>
            </div>
            <div class="field">
                <label>Ano</label>
                <select id="filtroAnoCS">
                    <option value="todos">Todos os Anos</option>
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026" selected>2026</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Data Venda</th>
                        <th>Vendedor</th>
                        <th>Cliente</th>
                        <th>Telefone</th>
                        <th>Data Onboarding</th>
                        <th>Horário</th>
                        <th>On. Aconteceu?</th>
                        <th>Squad</th>
                        <th>Área de Atuação</th>
                        <th>Material</th>
                        <th style="min-width: 190px;">Teses</th>
                        <th style="min-width: 190px;">Observações</th>
                    </tr>
                </thead>
                <tbody id="listaCSCorpo"></tbody>
            </table>
        </div>
    </div>
</main>

<script type="module" src="cs.js"></script>
</body>
</html>
