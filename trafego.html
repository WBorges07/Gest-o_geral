<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Pro - Gestão de Tráfego</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/imask"></script>
    <style>
        .tabs-squad {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        .tab-btn {
            background: var(--input);
            color: #aaa;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
        }
        .tab-btn:hover {
            color: var(--text);
            border-color: var(--accent);
        }
        .tab-btn.active {
            background: rgba(0, 255, 136, 0.15);
            color: var(--accent);
            border-color: var(--accent);
        }
        .select-status-trafego {
            padding: 5px 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            outline: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .select-status-trafego.subindo {
            background-color: rgba(255, 204, 0, 0.2);
            color: #ffcc00;
            border-color: #ffcc00;
        }
        .select-status-trafego.ativo {
            background-color: rgba(0, 255, 136, 0.2);
            color: var(--accent);
            border-color: var(--accent);
        }
        .select-status-trafego.pausado {
            background-color: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border-color: #ff4444;
        }

        .select-tendencia {
            padding: 5px 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            outline: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .select-tendencia.subir {
            background-color: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border-color: #ff4444;
        }
        .select-tendencia.manter {
            background-color: rgba(0, 122, 255, 0.2);
            color: #3399ff;
            border-color: #007aff;
        }
        .select-tendencia.descer {
            background-color: rgba(0, 255, 136, 0.2);
            color: var(--accent);
            border-color: var(--accent);
        }

        .select-satisfacao {
            padding: 5px 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            outline: none;
            cursor: pointer;
        }
        .select-satisfacao.satisfeito {
            background-color: rgba(0, 255, 136, 0.2);
            color: var(--accent);
            border-color: var(--accent);
        }
        .select-satisfacao.alerta {
            background-color: rgba(255, 204, 0, 0.2);
            color: #ffcc00;
            border-color: #ffcc00;
        }
        .select-satisfacao.insatisfeito {
            background-color: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border-color: #ff4444;
        }
        .input-textarea-trafego {
            width: 100%;
            min-width: 140px;
            max-width: 220px;
            min-height: 42px;
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--input);
            color: var(--text);
            font-size: 0.8rem;
            resize: vertical;
            box-sizing: border-box;
        }
        .input-moeda-trafego {
            width: 95px;
            padding: 5px 6px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--input);
            color: var(--text);
            font-size: 0.8rem;
        }
        .btn-logout {
            margin-top: auto;
            background: rgba(255, 68, 68, 0.15);
            color: #ff4444;
            border: 1px solid #ff4444;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            text-align: center;
            transition: var(--transition);
        }
        .btn-logout:hover {
            background: #ff4444;
            color: #fff;
        }
    </style>
</head>
<body class="dark-mode">

<nav class="sidebar" style="display: flex; flex-direction: column; justify-content: space-between; height: 100vh;">
    <div>
        <div class="sidebar-header">
            <h3>Menu</h3>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Vendas</a></li>
            <li><a href="financeiro.html">Financeiro</a></li>
            <li><a href="cs.html">CS</a></li>
            <li><a href="#" class="active">Gestão de Tráfego</a></li>
            <li><a href="midias.html">Mídias</a></li>
            <li><a href="bi.html">B.I</a></li>
        </ul>
    </div>
    <div style="padding: 15px;">
        <button id="btnSair" class="btn-logout">🚪 Sair</button>
    </div>
</nav>

<main class="main-content">
    <div class="container">
        <h2>🚦 Gestão de Tráfego</h2>

        <!-- ABAS DE SQUADS -->
        <div class="tabs-squad">
            <button class="tab-btn active" data-squad="todos">Todos</button>
            <button class="tab-btn" data-squad="Squad Black Mamba">Squad Black Mamba</button>
            <button class="tab-btn" data-squad="Squad Titans">Squad Titans</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Telefone</th>
                        <th>Squad</th>
                        <th>Gestor de Tráfego</th>
                        <th>Investimento Mensal</th>
                        <th>Plataforma de Início</th>
                        <th>Status da Campanha</th>
                        <th>CPL</th>
                        <th>Tendência</th>
                        <th>Orçamento</th>
                        <th>Saldo Restante</th>
                        <th>Grau de Satisfação</th>
                        <th style="min-width: 150px;">Estratégia Adotada</th>
                        <th style="min-width: 150px;">Observações</th>
                    </tr>
                </thead>
                <tbody id="listaTrafegoCorpo"></tbody>
            </table>
        </div>
    </div>
</main>

<script type="module" src="trafego.js"></script>
</body>
</html>
