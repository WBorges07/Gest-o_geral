<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Agência Digital Talismã</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* ---------- Página de login: acender a luz para revelar o formulário ---------- */

  html, body.login-page {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body.login-page {
    position: relative;
    background: radial-gradient(circle at 50% 38%, #0e1420 0%, #05070b 65%, #020304 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* leve textura/vinheta para dar profundidade ao ambiente escuro */
  .room-vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 0%, rgba(0,255,136,0.05), transparent 45%),
                radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.6), transparent 60%);
    z-index: 1;
  }

  /* ---------- Cordão + lâmpada ---------- */
  .light-switch {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 30;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .light-switch .wire {
    width: 2px;
    height: 46px;
    background: linear-gradient(#3a4552, #1a2029);
  }

  .bulb {
    width: 46px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 0 0 rgba(255, 214, 102, 0));
    transition: filter 0.4s ease;
  }

  .bulb svg { width: 100%; height: 100%; overflow: visible; }

  .bulb .glass {
    fill: #23282f;
    stroke: #3a4552;
    stroke-width: 1.5;
    transition: fill 0.4s ease, stroke 0.4s ease;
  }

  .bulb .filament {
    stroke: #4a5361;
    stroke-width: 1.4;
    fill: none;
    transition: stroke 0.4s ease;
  }

  .switch-hint {
    margin-top: 10px;
    font-size: 0.72rem;
    color: #66707c;
    letter-spacing: 0.02em;
    white-space: nowrap;
    opacity: 0.9;
    transition: opacity 0.5s ease;
  }

  .light-switch:hover .bulb {
    filter: drop-shadow(0 0 6px rgba(255, 214, 102, 0.25));
  }

  /* estado aceso */
  body.is-lit .bulb {
    filter: drop-shadow(0 0 22px rgba(255, 214, 102, 0.85)) drop-shadow(0 0 46px rgba(255, 214, 102, 0.4));
    animation: flicker 0.6s steps(1, end) 1;
  }

  body.is-lit .bulb .glass { fill: #ffe08a; stroke: #ffd666; }
  body.is-lit .bulb .filament { stroke: #7a4a00; }

  body.is-lit .switch-hint { opacity: 0; }

  @keyframes flicker {
    0%   { opacity: 1; }
    12%  { opacity: 0.3; }
    20%  { opacity: 1; }
    28%  { opacity: 0.4; }
    36%  { opacity: 1; }
    100% { opacity: 1; }
  }

  /* halo de luz que se espalha a partir da lâmpada */
  .light-glow {
    position: fixed;
    top: -120px;
    left: 50%;
    width: 1400px;
    height: 1400px;
    transform: translateX(-50%) scale(0);
    background: radial-gradient(circle, rgba(255, 221, 140, 0.16) 0%, rgba(255, 221, 140, 0.05) 32%, transparent 60%);
    pointer-events: none;
    z-index: 5;
    transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
  }

  body.is-lit .light-glow { transform: translateX(-50%) scale(1); }

  /* ---------- conteúdo revelado ---------- */
  .content-layer {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    transform: translateY(14px) scale(0.97);
    filter: blur(6px);
    pointer-events: none;
    transition: opacity 0.9s ease 0.25s, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.25s, filter 0.9s ease 0.25s;
  }

  body.is-lit .content-layer {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
    pointer-events: auto;
  }

  .login-logo {
    width: 240px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .login-logo .gem {
    width: 54px;
    height: 54px;
    filter: drop-shadow(0 0 14px rgba(94, 170, 255, 0.45));
  }

  .login-logo .wordmark {
    font-family: 'Orbitron', -apple-system, sans-serif;
    font-weight: 800;
    font-size: 1.9rem;
    letter-spacing: 0.06em;
    line-height: 1;
    background: linear-gradient(180deg, #ffffff 0%, #bcd4f2 45%, #6f96c9 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 22px rgba(120, 175, 255, 0.35);
  }

  .login-logo .subline {
    font-family: 'Orbitron', -apple-system, sans-serif;
    font-size: 0.6rem;
    font-weight: 500;
    letter-spacing: 0.32em;
    color: #7f93ad;
    margin-left: 0.32em;
  }

  .login-container { width: 340px; max-width: 90vw; margin-top: -18px; }

  .form-card {
    background: rgba(22, 27, 34, 0.85);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border, #30363d);
    border-radius: 12px;
    padding: 28px 26px 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
  }

  .form-card label {
    display: block;
    font-size: 0.75rem;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }

  .form-card input {
    width: 100%;
    background: var(--input, #21262d);
    border: 1px solid var(--border, #30363d);
    color: var(--text, #c9d1d9);
    padding: 11px 13px;
    border-radius: 8px;
    outline: none;
    font-size: 0.92rem;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .form-card input:focus {
    border-color: var(--accent, #00ff88);
    box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.12);
  }

  #btnSalvar {
    width: 100%;
    margin-top: 6px;
    background: var(--accent, #00ff88);
    color: #06110b;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.92rem;
    cursor: pointer;
    transition: background 0.25s ease, transform 0.15s ease;
  }

  #btnSalvar:hover { background: var(--accent-hover, #00cc6a); }
  #btnSalvar:active { transform: scale(0.98); }

  .footer-note {
    text-align: center;
    color: #4b5560;
    font-size: 0.7rem;
    margin-top: 18px;
  }

  @media (prefers-reduced-motion: reduce) {
    .content-layer, .bulb, .light-glow { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body class="login-page">

<div class="room-vignette"></div>
<div class="light-glow"></div>

<div class="light-switch" id="lightSwitch" role="button" tabindex="0" aria-label="Acender a luz para revelar o login">
    <div class="wire"></div>
    <div class="bulb">
        <svg viewBox="0 0 40 50">
            <path class="glass" d="M20 2 C10 2 3 9 3 19 C3 26 7 30 10 34 C12 36.5 12 38 12 40 L28 40 C28 38 28 36.5 30 34 C33 30 37 26 37 19 C37 9 30 2 20 2 Z"/>
            <path class="filament" d="M14 20 L18 26 L14 32 M26 20 L22 26 L26 32"/>
            <rect x="12" y="40" width="16" height="6" rx="1.5" fill="#3a4552"/>
        </svg>
    </div>
    <div class="switch-hint">clique para acender a luz</div>
</div>

<div class="content-layer">
    <div class="login-logo">
        <svg class="gem" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="gemTop" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#eaf6ff"/>
                    <stop offset="55%" stop-color="#7fc4ff"/>
                    <stop offset="100%" stop-color="#2f7fd6"/>
                </linearGradient>
                <linearGradient id="gemLeft" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#4aa8ec"/>
                    <stop offset="100%" stop-color="#134a86"/>
                </linearGradient>
                <linearGradient id="gemRight" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#8fd6ff"/>
                    <stop offset="100%" stop-color="#1c5fa8"/>
                </linearGradient>
            </defs>
            <polygon points="8,22 32,10 56,22 32,26" fill="url(#gemTop)"/>
            <polygon points="8,22 32,26 32,58" fill="url(#gemLeft)"/>
            <polygon points="56,22 32,26 32,58" fill="url(#gemRight)"/>
            <polygon points="8,22 2,24 32,58" fill="#0e3866" opacity="0.55"/>
            <polygon points="56,22 62,24 32,58" fill="#0a2c52" opacity="0.55"/>
        </svg>
        <div>
            <span class="wordmark">TALISMÃ</span>
            <div class="subline">MARKETING DIGITAL</div>
        </div>
    </div>

    <div class="login-container">
        <div class="form-card">
            <form id="loginForm">
                <div class="field" style="margin-bottom: 18px;">
                    <label>E-mail de Acesso</label>
                    <input type="email" id="email" placeholder="admin@agenciatalisma.com" required>
                </div>

                <div class="field" style="margin-bottom: 10px;">
                    <label>Palavra-passe</label>
                    <input type="password" id="senha" placeholder="••••••••" required>
                </div>

                <div id="loginError" style="color: var(--danger, #ff4444); font-size: 0.8rem; margin-bottom: 15px; display: none;">
                    E-mail ou senha incorretos.
                </div>

                <button type="submit" id="btnSalvar">Entrar no Painel</button>
            </form>
        </div>
        <p class="footer-note">&copy; 2026 Agência Digital Talismã</p>
    </div>
</div>

<script>
    const lightSwitch = document.getElementById('lightSwitch');
    const turnOn = () => {
        if (document.body.classList.contains('is-lit')) return;
        document.body.classList.add('is-lit');
        setTimeout(() => {
            const emailInput = document.getElementById('email');
            if (emailInput) emailInput.focus();
        }, 700);
    };
    lightSwitch.addEventListener('click', turnOn);
    lightSwitch.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); turnOn(); }
    });
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyARsHedCxsS4n3s6WxEopEDXzQPWAjrhp8",
        authDomain: "controle-de-gestao-976f4.firebaseapp.com",
        projectId: "controle-de-gestao-976f4",
        storageBucket: "controle-de-gestao-976f4.firebasestorage.app",
        messagingSenderId: "424359580737",
        appId: "1:424359580737:web:5d40c4213aa732171da2c0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('loginError');

    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;

        signInWithEmailAndPassword(auth, email, senha)
            .then(() => {
                window.location.href = "index.html";
            })
            .catch((error) => {
                errorMsg.style.display = 'block';
                console.error("Erro no login:", error.message);
            });
    });
</script>
</body>
</html>
