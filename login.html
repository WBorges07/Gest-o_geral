<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Agência Digital Talismã</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

<div class="login-container">
    <div class="login-logo">
        <h1>TALISMÃ</h1>
        <p>Agência Digital</p>
    </div>

    <div class="form-card">
        <form id="loginForm">
            <div class="field" style="margin-bottom: 20px;">
                <label>E-mail de Acesso</label>
                <input type="email" id="email" placeholder="admin@agenciatalisma.com" required>
            </div>

            <div class="field" style="margin-bottom: 10px;">
                <label>Palavra-passe</label>
                <input type="password" id="senha" placeholder="••••••••" required>
            </div>

            <div id="loginError" style="color: var(--danger); font-size: 0.8rem; margin-bottom: 15px; display: none;">
                E-mail ou senha incorretos.
            </div>

            <button type="submit" id="btnSalvar" style="width: 100%; margin-top: 10px;">
                Entrar no Painel
            </button>
        </form>
    </div>
    <p style="text-align: center; color: #444; font-size: 0.7rem; margin-top: 20px;">
        &copy; 2026 Agência Digital Talismã
    </p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyARsHedCxsS4n3s6WxEopEDXzQPWAjrhp8",
        authDomain: "controle-de-gestao-976f4.firebaseapp.com",
        projectId: "controle-de-gestao-976f4",
        storageBucket: "controle-de-gestao-976f4.firebasestorage.app",
        messagingSenderId: "424359580737",
        appId: "1:424359580737:web:5d40c4213aa732171da2c0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('loginError');

    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;

        signInWithEmailAndPassword(auth, email, senha)
            .then(() => {
                window.location.href = "index.html";
            })
            .catch((error) => {
                errorMsg.style.display = 'block';
                console.error("Erro no login:", error.message);
            });
    });
</script>
</body>
</html>
