<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Pro - Mídias</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .tabs-squad {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        .tab-btn {
            background: var(--input);
            color: #aaa;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
        }
        .tab-btn:hover {
            color: var(--text);
            border-color: var(--accent);
        }
        .tab-btn.active {
            background: rgba(0, 255, 136, 0.15);
            color: var(--accent);
            border-color: var(--accent);
        }
        .select-social-midia {
            width: 100%;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--input);
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }
        .btn-clip {
            background: rgba(0, 255, 136, 0.15);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            transition: var(--transition);
        }
        .btn-clip:hover {
            background: var(--accent);
            color: #000;
        }
        .lista-arquivos {
            list-style: none;
            padding: 0;
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .item-arquivo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--input);
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 0.78rem;
            border: 1px solid var(--border);
        }
        .item-arquivo a {
            color: var(--accent);
            text-decoration: none;
            word-break: break-all;
        }
        .item-arquivo a:hover {
            text-decoration: underline;
        }
        .btn-remover-arq {
            background: none;
            border: none;
            color: var(--danger, #ff4444);
            cursor: pointer;
            font-weight: bold;
            margin-left: 8px;
        }
        .btn-logout {
            margin-top: auto;
            background: rgba(255, 68, 68, 0.15);
            color: #ff4444;
            border: 1px solid #ff4444;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            text-align: center;
            transition: var(--transition);
        }
        .btn-logout:hover {
            background: #ff4444;
            color: #fff;
        }
    </style>
</head>
<body class="dark-mode">

<input type="file" id="fileInputGlobal" multiple style="display: none;">

<nav class="sidebar" style="display: flex; flex-direction: column; justify-content: space-between; height: 100vh;">
    <div>
        <div class="sidebar-header">
            <h3>Menu</h3>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Vendas</a></li>
            <li><a href="financeiro.html">Financeiro</a></li>
            <li><a href="cs.html">CS</a></li>
            <li><a href="trafego.html">Gestão de Tráfego</a></li>
            <li><a href="#" class="active">Mídias</a></li>
            <li><a href="bi.html">B.I</a></li>
        </ul>
    </div>
    <div style="padding: 15px;">
        <button id="btnSair" class="btn-logout"> Sair</button>
    </div>
</nav>

<main class="main-content">
    <div class="container">
        <h2>📎 Gestão de Mídias e Arquivos</h2>

        <!-- ABAS DE SQUADS -->
        <div class="tabs-squad">
            <button class="tab-btn active" data-squad="todos">Todos</button>
            <button class="tab-btn" data-squad="Squad Black Mamba">Squad Black Mamba</button>
            <button class="tab-btn" data-squad="Squad Titans">Squad Titans</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Squad</th>
                        <th>Social Mídia</th>
                        <th style="min-width: 180px;">Adicionar Links/Arquivos</th>
                        <th style="min-width: 250px;">Arquivos Salvos</th>
                    </tr>
                </thead>
                <tbody id="listaMidiasCorpo"></tbody>
            </table>
        </div>
    </div>
</main>

<script>
    document.addEventListener('click', function(e) {
        if (e.target && e.target.classList.contains('btn-clip')) {
            document.getElementById('fileInputGlobal').click();
        }
    });
</script>

<script type="module" src="midias.js"></script>
</body>
</html>
